services:
  - type: web
    name: seal-backend
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @seal/backend build
    startCommand: node backend/dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: FRONTEND_URL
        sync: false # set to the deployed Vercel URL after the frontend is up
