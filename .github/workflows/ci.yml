name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      # Rebuilds every symbol's *_series.csv from the committed raw sources
      # (no network — the *_ohlcv_raw.json files are already in the repo)
      # and runs the real backtest for each, so backend tests have real
      # reports to serve against.
      - run: python scripts/build_real_dataset.py --all
      - run: |
          for cfg in default rnvda raapl ramzn rmsft; do
            python scripts/run_backtest.py --config configs/$cfg.yaml
          done
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-reports
          path: reports/*_summary.json

  js:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - uses: actions/download-artifact@v4
        with:
          name: backtest-reports
          path: reports
      - run: pnpm test
      - run: pnpm build
