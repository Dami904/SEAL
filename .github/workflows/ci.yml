name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      # Rebuilds real_series.csv from the committed raw source (no network —
      # tsla_ohlcv_raw.json is already in the repo) and runs the real
      # backtest, so backend tests have a real report to serve against.
      - run: python scripts/build_real_dataset.py
      - run: python scripts/run_backtest.py --config configs/default.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/backtest_summary.json

  js:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - uses: actions/download-artifact@v4
        with:
          name: backtest-report
          path: reports
      - run: pnpm test
      - run: pnpm build
